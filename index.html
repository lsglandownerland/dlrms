<!-- HTML এর অন্যান্য কোড এর নিচে বা </body > ট্যাগের ঠিক উপরে বসাবেন -->

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const khatiyanId = urlParams.get('id');

    if (khatiyanId) {
        let savedKhatiyans = JSON.parse(localStorage.getItem('saved_khatiyans') || '{}');
        let currentData = savedKhatiyans[khatiyanId];

        if (currentData) {
            showKhatiyanData(currentData);
        } else {
            document.getElementById('khatiyanPage').style.display = 'none';
            document.getElementById('errorMessage').innerText = '⚠️ উক্ত খতিয়ানটি ডাটাবেজে পাওয়া যায়নি অথবা মুছে ফেলা হয়েছে!';
            document.getElementById('errorMessage').style.display = 'block';
        }
    }
</script>
