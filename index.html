<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>খতিয়ান তথ্য ব্যবস্থাপনা ও অনলাইন প্রিন্ট সিস্টেম</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .logo-section {
            margin-bottom: 20px;
        }
        .logo-section img {
            width: 100px;
            height: auto;
        }
        .header-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .content-box {
            margin-top: 30px;
            text-align: left;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #f2f2f2;
        }
        .footer-logo {
            margin-top: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- লোগো সেクション -->
        <div class="footer-logo">
            <img src="logo.png" alt="জেলা রেকর্ড রুম লোগো">
        </div>

        <div class="header-title">
            খতিয়ান তথ্য ব্যবস্থাপনা ও অনলাইন প্রিন্ট সিস্টেম
        </div>

        <div class="content-box">
            <table>
                <thead>
                    <tr>
                        <th>ক্রমিক</th>
                        <th>খতিয়ান নং</th>
                        <th>মৌজা</th>
                        <th>মোট জমি</th>
                        <th>তারিখ</th>
                        <th>সংরক্ষণ</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6">কোনো খতিয়ান সংরক্ষিত নেই।</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
