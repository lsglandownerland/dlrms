<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>খতিয়ান বিস্তারিত তথ্য</title>
  <!-- QRCode library (QR code তৈরির জন্য) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'SolaimanLipi', Arial, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      color: #333;
    }
    /* ওপরের সবুজ বার */
    .top-date-bar {
      background-color: #719680;
      color: #ffffff;
      text-align: center;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
    }
    /* কন্টেইনার */
    .container {
      max-width: 500px;
      margin: 15px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header-logo {
      text-align: center;
      margin-bottom: 15px;
    }
    .header-logo img {
      width: 60px;
    }
    .title {
      text-align: center;
      color: #1b5e20;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .info-table {
      width: 100%;
      border-collapse: collapse;
    }
    .info-table td {
      padding: 8px 4px;
      font-size: 16px;
      vertical-align: top;
    }
    .info-table td.label {
      width: 30%;
      font-weight: bold;
      color: #222;
    }
    .info-table td.colon {
      width: 5%;
    }
    .info-table td.value {
      width: 65%;
      color: #444;
    }
    /* গুরুত্বপূর্ণ লিংক সেকশন */
    .footer-links {
      background-color: #e8f5e9;
      padding: 15px;
      margin-top: 25px;
      border-radius: 6px;
    }
    .footer-links h4 {
      color: #1b5e20;
      margin-bottom: 10px;
    }
    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .links-grid a {
      color: #2e7d32;
      text-decoration: none;
      font-size: 14px;
    }
    /* QR code কন্টেইনার (হাইড থাকবে বা প্রিন্টে দেখাবে) */
    #qrcode {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- অটোমেটিক আপডেট হওয়া ডেট বার -->
  <div class="top-date-bar" id="top_full_date">
    <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে অটো তারিখ ও বার বসবে -->
  </div>

  <div class="container">
    <div class="header-logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Government_Seal_of_Bangladesh.svg" alt="BD Seal">
    </div>

    <div class="title" id="khatian_title">খতিয়ান নং - ৪৮৫</div>

    <table class="info-table">
      <tr>
        <td class="label">মালিক</td>
        <td class="colon">:</td>
        <td class="value" id="val_owner">দং নজির আহমদ</td>
      </tr>
      <tr>
        <td class="label">দাগ নং</td>
        <td class="colon">:</td>
        <td class="value" id="val_dag">৪১৫০</td>
      </tr>
      <tr>
        <td class="label">সার্ভে</td>
        <td class="colon">:</td>
        <td class="value" id="val_survey">বি আর এস</td>
      </tr>
      <tr>
        <td class="label">মৌজা</td>
        <td class="colon">:</td>
        <td class="value" id="val_mouza">আলাদিনগর</td>
      </tr>
      <tr>
        <td class="label">উপজেলা</td>
        <td class="colon">:</td>
        <td class="value" id="val_upazila">বেগমগঞ্জ রাজস্ব সার্কেল</td>
      </tr>
      <tr>
        <td class="label">জেলা</td>
        <td class="colon">:</td>
        <td class="value" id="val_zila">নোয়াখালী</td>
      </tr>
      <tr>
        <td class="label">বিভাগ</td>
        <td class="colon">:</td>
        <td class="value" id="val_div">চট্টগ্রাম</td>
      </tr>
      <tr>
        <td class="label">তারিখ</td>
        <td class="colon">:</td>
        <td class="value" id="val_date">১৮ সেপ্টেম্বর, ২০২৩</td>
      </tr>
    </table>

    <div id="qrcode"></div>

    <div class="footer-links">
      <h4>গুরুত্বপূর্ণ লিংক</h4>
      <div class="links-grid">
        <a href="#">▶ বাংলাদেশ জাতীয় তথ্য বাতায়ন</a>
        <a href="#">▶ সাপোর্ট টিকেট</a>
        <a href="#">▶ ভূমি মন্ত্রণালয়</a>
        <a href="#">▶ গোপনীয়তা নীতি</a>
      </div>
    </div>
  </div>

  <script>
    // ১. সম্পূর্ণ বার, বাংলা তারিখ ও ইংরেজি তারিখ জেনারেট করার লজিক
    function getFullHeaderDate() {
      var today = new Date();

      // বার নির্বাচন
      var days = ['রবিবার', 'সোমবার', 'মঙ্গলবার', 'বুধবার', 'বৃহস্পতিবার', 'শুক্রবার', 'শনিবার'];
      var dayName = days[today.getDay()];

      // ইংরেজি তারিখ ও মাস
      var enMonths = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
      var enDay = today.getDate().toLocaleString('bn-BD');
      var enMonth = enMonths[today.getMonth()];
      var enYear = today.getFullYear().toLocaleString('bn-BD');
      var fullEnDate = enDay + ' ' + enMonth + ' ' + enYear;

      // বাংলা তারিখ ও মাস হিসাব
      var bnMonths = ['বৈশাখ', 'জ্যৈষ্ঠ', 'আষাঢ়', 'শ্রাবণ', 'ভাদ্র', 'আশ্বিন', 'কার্তিক', 'অগ্রহায়ণ', 'পৌষ', 'মাঘ', 'ফাল্গুন', 'চৈত্র'];
      var year = today.getFullYear();
      var month = today.getMonth();
      var date = today.getDate();

      var bnYear = (month > 3 || (month === 3 && date >= 14)) ? (year - 593) : (year - 594);
      var bnMonth, bnDate;

      if (month === 0) {
        if (date <= 13) { bnMonth = bnMonths[8]; bnDate = date + 17; }
        else { bnMonth = bnMonths[9]; bnDate = date - 13; }
      } else if (month === 1) {
        if (date <= 12) { bnMonth = bnMonths[9]; bnDate = date + 18; }
        else { bnMonth = bnMonths[10]; bnDate = date - 12; }
      } else if (month === 2) {
        if (date <= 14) { bnMonth = bnMonths[10]; bnDate = date + 16; }
        else { bnMonth = bnMonths[11]; bnDate = date - 14; }
      } else if (month === 3) {
        if (date <= 13) { bnMonth = bnMonths[11]; bnDate = date + 17; }
        else { bnMonth = bnMonths[0]; bnDate = date - 13; }
      } else if (month === 4) {
        if (date <= 14) { bnMonth = bnMonths[0]; bnDate = date + 17; }
        else { bnMonth = bnMonths[1]; bnDate = date - 14; }
      } else if (month === 5) {
        if (date <= 14) { bnMonth = bnMonths[1]; bnDate = date + 17; }
        else { bnMonth = bnMonths[2]; bnDate = date - 14; }
      } else if (month === 6) {
        if (date <= 15) { bnMonth = bnMonths[2]; bnDate = date + 16; }
        else { bnMonth = bnMonths[3]; bnDate = date - 15; }
      } else if (month === 7) {
        if (date <= 16) { bnMonth = bnMonths[3]; bnDate = date + 16; }
        else { bnMonth = bnMonths[4]; bnDate = date - 16; }
      } else if (month === 8) {
        if (date <= 16) { bnMonth = bnMonths[4]; bnDate = date + 15; }
        else { bnMonth = bnMonths[5]; bnDate = date - 16; }
      } else if (month === 9) {
        if (date <= 16) { bnMonth = bnMonths[5]; bnDate = date + 15; }
        else { bnMonth = bnMonths[6]; bnDate = date - 16; }
      } else if (month === 10) {
        if (date <= 15) { bnMonth = bnMonths[6]; bnDate = date + 15; }
        else { bnMonth = bnMonths[7]; bnDate = date - 15; }
      } else {
        if (date <= 15) { bnMonth = bnMonths[7]; bnDate = date + 15; }
        else { bnMonth = bnMonths[8]; bnDate = date - 15; }
      }

      var fullBnDate = bnDate.toLocaleString('bn-BD') + ' ' + bnMonth + ' ' + bnYear.toLocaleString('bn-BD');

      return dayName + ', ' + fullBnDate + ', ' + fullEnDate;
    }

    // ২. পেজ লোড হওয়ার সাথে সাথে বার ও তারিখ আপডেট করা
    window.onload = function() {
      // ডেট বার আপডেট
      var topBar = document.getElementById('top_full_date');
      if (topBar) {
        topBar.textContent = getFullHeaderDate();
      }

      // ৩. অনলাইন QR কোড জেনারেট লজিক
      var websiteBaseUrl = "https://yourdomain.github.io/index.html"; // আপনার হোস্ট করা অনলাইনের লিঙ্কটি এখানে দেবেন
      var khatianNo = "৪৮৫"; // খতিয়ান নম্বর

      var qrPayload = websiteBaseUrl + '?verify=true&khatian=' + encodeURIComponent(khatianNo);

      // কিউআর কোড রেন্ডার
      var qrContainer = document.getElementById('qrcode');
      if (qrContainer) {
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
          text: qrPayload,
          width: 128,
          height: 128
        });
      }
    };
  </script>
</body>
</html>
